name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri/webkitgtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Cargo.toml exists
        id: has_cargo
        run: |
          if [ -f Cargo.toml ] || [ -f src-tauri/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        if: steps.has_cargo.outputs.exists == 'true'
        run: cargo build --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: cargo test
        if: steps.has_cargo.outputs.exists == 'true'
        run: cargo test --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: No Rust project yet
        if: steps.has_cargo.outputs.exists == 'false'
        run: echo "No Cargo.toml found yet — skipping build/test. This passes trivially until rust-core scaffolds the project."
