name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri/webkitgtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Check Cargo.toml exists
        id: has_cargo
        run: |
          if [ -f Cargo.toml ] || [ -f src-tauri/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        if: steps.has_cargo.outputs.exists == 'true'
        run: cargo build --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: cargo test
        if: steps.has_cargo.outputs.exists == 'true'
        run: cargo test --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: No Rust project yet
        if: steps.has_cargo.outputs.exists == 'false'
        run: echo "No Cargo.toml found yet — skipping build/test. This passes trivially until rust-core scaffolds the project."

  build-windows:
    # Test both the normal backend and the opt-in diagnostics. Installer builds
    # below keep the feature disabled; the diagnostic executable is a separate
    # artifact for manual testing in an interactive Windows session.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Check Cargo.toml exists
        id: has_cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ] || [ -f src-tauri/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: cargo build --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: cargo test
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: cargo test --verbose --locked
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: cargo test (Windows diagnostics)
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: cargo test --verbose --locked --features windows-diagnostics
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: cargo build (Windows diagnostics)
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: cargo build --locked --features windows-diagnostics
        working-directory: ${{ hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}

      - name: Upload Windows diagnostics
        if: steps.has_cargo.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-idle-diagnostics
          path: src-tauri/target/debug/zzzzziglerrr.exe
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node.js
        if: steps.has_cargo.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: npm install

      - name: tauri build (msi/nsis)
        if: steps.has_cargo.outputs.exists == 'true'
        shell: bash
        run: npm run tauri build -- --bundles msi,nsis

      - name: Upload Windows installers
        if: steps.has_cargo.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: No Rust project yet
        if: steps.has_cargo.outputs.exists == 'false'
        shell: bash
        run: echo "No Cargo.toml found yet — skipping build/test. This passes trivially until rust-core scaffolds the project."
